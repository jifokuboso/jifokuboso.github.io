name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build
      env:
        NODE_ENV: production
    
    - name: Debug - List files after build
      run: |
        echo "Root directory contents:"
        ls -la
        echo "Checking if dist directory exists:"
        if [ -d "dist" ]; then
          echo "dist directory exists, contents:"
          ls -la dist/
        else
          echo "dist directory does not exist!"
        fi
        echo "Checking if out directory exists:"
        if [ -d "out" ]; then
          echo "out directory exists, contents:"
          ls -la out/
        else
          echo "out directory does not exist!"
        fi
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 