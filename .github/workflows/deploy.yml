name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Next.js app
      run: |
        echo "Building Next.js application..."
        npm run build
      env:
        NODE_ENV: production
        NEXT_TELEMETRY_DISABLED: 1
    
    - name: Debug - Comprehensive file check
      run: |
        echo "=== Root directory contents ==="
        ls -la
        
        echo "=== Checking next.config.ts ==="
        cat next.config.ts
        
        echo "=== Checking package.json build script ==="
        grep -A 5 -B 5 '"build"' package.json
        
        echo "=== Checking for Next.js output directories ==="
        if [ -d "dist" ]; then
          echo "✅ dist directory exists!"
          echo "dist directory contents:"
          ls -la dist/ | head -20
          echo "dist directory size:"
          du -sh dist/
        else
          echo "❌ dist directory does not exist!"
        fi
        
        if [ -d "out" ]; then
          echo "✅ out directory exists!"
          echo "out directory contents:"
          ls -la out/ | head -20
          echo "out directory size:"
          du -sh out/
        else
          echo "❌ out directory does not exist!"
        fi
        
        if [ -d ".next" ]; then
          echo "✅ .next directory exists!"
          ls -la .next/ | head -10
        else
          echo "❌ .next directory does not exist!"
        fi
        
        echo "=== Checking if index.html exists in output directories ==="
        find . -name "index.html" -not -path "./node_modules/*" -not -path "./.git/*"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4 